# LEI 信号系统规则账本 v2
#
# 溯源层级（V2 起）：
#   最高溯源 = docs/handbook-30-videos.md（手册，引用格式「手册 x.y」）
#   实施规格 = docs/trading-spec-v2.md（V2.2 回测规格，2026-08-24；V2.1 已存档 trading-spec-v2.1.md）
#   audit 对照 = docs/trading-spec-v1.md + configs/rules.v1.yaml（1.5.0，冻结）
#
# provenance 取值：
#   lei_explicit    - 手册/视频明确讲出的规则
#   lei_inferred    - 根据视频画面与数学关系复原
#   existing_backtest - 旧回测采用的工程定义
#   research_proxy  - 为量化建立的代理指标，不冒充作者原始规则
#   user_config     - 用户自行选择的参数或阈值
#
# 任何 research_proxy 必须在界面标注「研究代理」。
# 阈值只能在此文件调整，且必须同时提升 version。禁止为迎合回测结果修改公式。
#
# implementation_status（ruleset 2.0.0 新增，描述 formula 与代码的关系）：
#   缺省        - formula 即当前 Python 判定层已实现语义，账本即实况
#   pending_v2  - 规格 V2.1 已定、代码未实现的排期项（按规格 §15 轮次落地）：
#                 新增规则：formula 为 V2 目标契约，落地前无任何代码读取本条；
#                 既有规则：formula 仍是 v1 现行语义（代码口径），V2 重写目标见
#                 note_cn「V2 目标」段，重写落地时同步更新 formula 与 version。
#
# 〔标定 V2.1，待彪哥确认〕= 规格作者未给数值、V2.1 讨论稿标定的默认值（规格 §17）：
# 确认前按默认值执行、不得视为作者标准；全部保留规格 §17 敏感性测试。

ruleset_version: "2.0.0"
source_video: "https://www.youtube.com/watch?v=7NkwlH6NOk8"
spec_source: "docs/trading-spec-v2.md"
source_manual: "docs/handbook-30-videos.md"

indicators:
  ema_periods: [20, 60, 120]
  sma_periods: [20, 60, 120]
  ema_seed: "first_window_sma"   # alpha = 2/(period+1)，以首窗口 SMA 作为种子
  atr_period: 14
  atr_method: "simple_average"   # 非 Wilder 平滑；与旧回测 spec 8.9 一致
  # V2 注意：规格 §17 的 ma_touch_distance / gap_definition 引用 ATR(20)，与全局
  # atr_period=14（旧回测口径）不一致；手册 6.3（海龟）为 TR 的 20 日 EMA。V2 新规则
  # 在各自 params 内声明 atr_period: 20（方法沿用 simple_average 保持系统一致），
  # 该差异已列入 docs/trading-spec-v2-audit.md 待彪哥拍板。
  lag_periods: [20, 60, 120]
  # MACD（研究代理）：标准 12/26/9。DIF=EMA(fast)-EMA(slow)，
  # DEA=EMA(signal,DIF)，hist=2*(DIF-DEA)。作强度/乖离解读，非转折。
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9

rules:
  # ---------------- LEI 三色 ----------------
  lei_color:
    rule_id: "lei_color"
    version: "1.0.0"
    provenance: "lei_explicit"
    formula: |
      green = Close(t) > EMA20(t) and Close(t) > Close(t-20)
      black = Close(t) < EMA20(t) and Close(t) < Close(t-20)
      gray  = ready and not green and not black
      unknown = 不足 21 根
    note_cn: "灰色表示均线方向分歧，需要关注；不等于卖出。"
    events: [lei_color_green_started, lei_color_gray_started, lei_color_black_started]

  # ---------------- 短周期 ----------------
  ema20_reclaim_rising:
    rule_id: "ema20_reclaim_rising"
    version: "1.0.0"
    provenance: "lei_explicit"
    formula: |
      Close(t-1) <= EMA20(t-1) and Close(t) > EMA20(t) and EMA20(t) > EMA20(t-1)
    note_cn: "早期转强。不要求与共同确认同一天。"

  dual_ma_bull_confirmed:
    rule_id: "dual_ma_bull_confirmed"
    version: "1.0.0"
    provenance: "lei_explicit"
    formula: |
      Close > EMA20 and Close > SMA20 and EMA20 > EMA20(t-1)
      and SMA20 > SMA20(t-1) and color == green
    note_cn: "读取当前状态，不要求 EMA20 穿越与 SMA20 确认同一天发生。"

  dual_ma_spread:
    rule_id: "dual_ma_spread"
    version: "1.0.0"
    provenance: "lei_inferred"
    formula: |
      spread = abs(EMA20 - SMA20) / Close
      expanding = spread 连续两日扩大且颜色为绿或黑
      contracting = spread 连续两日收窄
      cross = EMA20 与 SMA20 相对位置改变
    note_cn: "辅助信号，不单独决定趋势方向。"

  # ---------------- 长周期背景 ----------------
  long_trend:
    rule_id: "long_trend"
    version: "1.0.0"
    provenance: "lei_inferred"
    formula: |
      long_bull = EMA60 > EMA120
      long_bear = EMA60 < EMA120
      long_improving = (EMA60 上升 或 EMA120 上升) 且 (EMA60-EMA120) 向多头方向改善
      long_stable_bull = EMA60 > EMA120 且两者均不下降
      long_deteriorating = (EMA60-EMA120) 向空头方向恶化
    note_cn: "只作独立背景。绝对不得写入底部结构识别器作为硬门槛。"
    weekly_rule: "周线只在本周最后一个已完成交易日后生效，禁止把周五数据泄漏给周一至周四。"

  # ---------------- 摆动点 ----------------
  swing_pivots:
    rule_id: "swing_pivots"
    version: "1.0.0"
    provenance: "existing_backtest"
    ported_from: "licai@a25eae9 src/trading_v11/indicators/pivots.py"
    params:
      left: 3
      right: 3
    formula: |
      摆动高点：high 在 left+1+right 窗口内是唯一严格最高
      摆动低点：low  在 left+1+right 窗口内是唯一严格最低
      available_date = 右侧第 right 根 K 线的日期（确认日）
    note_cn: "历史研究必须使用确认日期，不得使用尚未确认的拐点。参数写入 rule_version。"

  # ---------------- 严格构造识别（规格 §7.3，V2.1 标定，pending_v2）----------------
  strict_structure:
    rule_id: "strict_structure"
    version: "2.0.0"   # 2.0.0：§15 第一轮落地（rules/strict_structure.py）
    provenance: "research_proxy"
    params:
      containment_merge: true    # 包含关系剔除：被完全包住的 K 线视为不存在
      min_bars: 3                # LH+LL（或 HL+HH）三根完成即确认
      immediate_effect: true     # 第三根收盘当根生效、不额外等待
      min_wave_bars: 6           # 顶 + 底相连 = 一个波段，最小 3+3 不共用
      proxy_fallback: "swing_left3_right3"  # 备选代理：已确认 swing（左3右3）
    formula: |
      顶部构造（手册 2.6 / 规格 §7.1）：先 lower high（不再创新高）再 lower low
      （跌破前一个低点），两步完成的最少三根 K 线即构造，第三根收盘当根生效；
      失效：其后价格重新突破构造前的最高点（higher high）-> 本构造作废，找下一个。
      底部构造（规格 §7.2，本版做多侧主用）：先 higher low 再 higher high，完全对称；
      失效：价格重新跌破构造低点并创新低。
      包含关系（规格 §7.3）：一根 K 线高低区间完全包住若干 K 线时，识别时剔除被
      包含者，只看突破包含结构、创立新极值的那根 K 线；
      极端构造（规格 §7.3）：创新高（低）的 K 线直接杀出 lower low（higher high）
      的两根 K 线情形，仍需第三根 K 线创出新的 lower low（higher high）确认才算完成。
      顶 + 底相连 = 一个波段，最小 6 根 K 线（3+3，不共用）。
      备选代理 = 已确认 swing high/low（左 3 右 3 分形；确认根数未走完前该枢轴
      不可用，防未来泄漏）。代理档位敏感性：2/2、3/3、5/5。
    note_cn: |
      顶底构造定义本身是手册 2.6【原系统原则】；「主实现 = 严格构造识别（三根完成
      即确认、当根生效）」是规格 §7.3【回测代理（V2.1 标定）】的选择（〔标定 V2.1，
      待彪哥确认〕，swing 左3右3 为备选代理），故整条标 research_proxy。构造是路标
      不是路（规格 §7.4）：出现只表示路况可能变化，可被新高/新低破坏，破坏了就找
      下一个，不抱着旧信号当圣杯。
      2.0.0 已落地（rules/strict_structure.py）。实现要点：包含合并后，向下突破
      前一根合并 K 线低点的新 K 线必然同时是 LH（若其高点更高则整体包含、被合并），
      故「简单三根构造」与「极端构造」在合并空间统一为：M1 -> 破 M1.low 的 M2 ->
      再破 M2.low 的 M_k 确认；底部镜像。确认/失效事件均产生，但与 tradability_gate
      同纪律不写入 live 每日事件日志（避免每标的一日一条淹没 UI）：作为内部检测器
      被模块 A（A3 结构条件）与回测引擎（A6② 顶部构造）消费，API/界面按需调用。
      与 top_structure / higher_low_bottom 的 v1 摆动口径分组对比后排期切换。
    events:
      - top_structure_strict_confirmed
      - bottom_structure_strict_confirmed
      - top_structure_strict_invalidated   # 2.0.0 新增：失效轨迹事件
      - bottom_structure_strict_invalidated

  # ---------------- 反转 K 线 ----------------
  bullish_engulfing:
    rule_id: "bullish_engulfing"
    version: "1.0.0"
    provenance: "research_proxy"
    formula: |
      Close(t-1) < Open(t-1)
      and Close(t) > Open(t)
      and Open(t) <= Close(t-1)
      and Close(t) >= Open(t-1)
    note_cn: "阳线反包。即使 EMA60<EMA120、周线未改善也必须独立保存，不得被 Block。"

  bullish_outside_reversal:
    rule_id: "bullish_outside_reversal"
    version: "1.0.0"
    provenance: "research_proxy"
    formula: |
      Low(t) <= Low(t-1) and Close(t) >= High(t-1) and Close(t) > Open(t)
    note_cn: "阳线外包反转。独立事件，不得被长周期趋势 Block。"

  bearish_engulfing:
    rule_id: "bearish_engulfing"
    version: "1.0.0"
    provenance: "research_proxy"
    formula: |
      Close(t-1) > Open(t-1)
      and Close(t) < Open(t)
      and Open(t) >= Close(t-1)
      and Close(t) <= Open(t-1)
    note_cn: "阴线反包，独立风险事件。"

  bearish_outside_reversal:
    rule_id: "bearish_outside_reversal"
    version: "1.0.0"
    provenance: "research_proxy"
    formula: |
      High(t) >= High(t-1) and Close(t) <= Low(t-1) and Close(t) < Open(t)
    note_cn: "阴线外包反转，独立风险事件。"

  # ---------------- 底部结构 ----------------
  higher_low_bottom:
    rule_id: "higher_low_bottom"
    version: "1.0.0"
    provenance: "lei_explicit"
    formula: |
      连续两个确认摆动低点，第二低点 > 第一低点
      颈线 = 两低点之间的最高价
      收盘突破颈线时确认
      C = 结构最低点（第一低点）
    note_cn: "不得加入日线/周线长趋势硬门槛。"

  double_bottom:
    rule_id: "double_bottom"
    version: "1.0.0"
    provenance: "lei_inferred"
    params:
      max_diff_atr: 1.0
    formula: |
      两确认低点价差 <= 第二低点处 1 ATR
      颈线 = 两低点之间最高价
      收盘突破颈线时确认
      C = 两低点较低者
    note_cn: "1 ATR 容差为 research_proxy 量化口径。"

  bullish_reversal_bottom:
    rule_id: "bullish_reversal_bottom"
    version: "1.0.0"
    provenance: "research_proxy"
    formula: |
      由 bullish_engulfing 或 bullish_outside_reversal 独立形成候选底部
      C = 反转 K 线的最低价
      不要求先出现双底
    note_cn: "解决「第二根阳线直接反包但系统完全没记录」的问题。"

  bottom_c_lifecycle:
    rule_id: "bottom_c_lifecycle"
    version: "1.0.0"
    provenance: "lei_explicit"
    formula: |
      自确认日的下一交易日起：
        Low(t) <= C  -> bottom_C_touched，结构永久失效
        Close(t) < C -> bottom_C_close_broken
    note_cn: "触及 C 后旧结构永久失效；后续上涨不能复活，只能形成新结构。"

  # ---------------- 顶部结构 ----------------
  top_structure:
    rule_id: "top_structure"
    version: "1.0.0"
    provenance: "existing_backtest"
    formula: |
      连续两个确认摆动高点，第二高点 < 第一高点
      颈线 = 两高点之间的最低价
      收盘跌破颈线时确认顶部警报
      后续 High > 第一高点 -> top_warning_invalidated_by_new_high
    note_cn: "只产生风险提示，不自动卖出。失效后不得继续参与 Top+Black。"

  # ---------------- 关键性波动 ----------------
  key_wave_black:
    rule_id: "key_wave_black"
    version: "1.0.0"
    provenance: "lei_explicit"
    formula: |
      key_black = Close < EMA20 and Close < Close(t-20)
      top_plus_black = 存在有效顶部警报 且 处于黑色
      black_without_top = 无有效顶部结构 且 处于黑色
    note_cn: "两个版本必须分别保存和统计，不能只保留表现较好的版本。"

  # ---------------- 量能 ----------------
  volume_proxies:
    rule_id: "volume_proxies"
    version: "2.1.0"
    provenance: "research_proxy"
    params:
      window: 20
      up_surge_ratio: 2.0   # V2.1 §4.8〔标定〕：>= 2.0 x MA20(vol)；v1.1.0 为 1.5
      breakout_ratio: 2.0
      bearish_ratio: 2.0
      shrink_lookback: 3
      shrink_recent_window: 3    # 2.1.0：缩量回调过滤（引擎 volume_filter=shrink）近 N 日均量
      shrink_prior_window: 3     # 2.1.0：前 M 日均量；shrink = 近N < 前M（严格小于）
    formula: |
      volume_ratio20 = Volume / mean(Volume, 20)
      volume_up_surge = Close 上涨 且 volume_ratio20 >= up_surge_ratio
      breakout_volume = Close 突破某个明确结构颈线 且 volume_ratio20 >= breakout_ratio
      pullback_shrink = 当前 Close 下跌 且 最近 shrink_lookback 日均量 < 前 shrink_lookback 日均量
      bearish_expansion = Close 下跌 且 volume_ratio20 >= bearish_ratio
    note_cn: |
      阈值为研究代理。V2.1 §4.8 把「异常大量」标定为 >= 2.0 x MA20(vol)
      （〔标定 V2.1，待彪哥确认〕；敏感性 1.5/2/3、窗口 10/20/60），
      ruleset 2.0.0 起 1.5 -> 2.0 生效（代码直接读本参数）。
      volume_up_surge 不要求结构颈线；breakout_volume 必须有结构颈线才会被记录
      （防止把「放量上行」错叫为「放量突破」）。pullback_shrink 是简单滚动代理
      （仅比较最近两段均量），不是真正的趋势分段。
      2.1.0（2026-08-25 补充验证轮）：引擎 volume_filter=shrink 读
      shrink_recent_window / shrink_prior_window（默认 3/3，与 pullback_shrink
      同量能口径；A 回调场景不要求 close 下跌，信号日本身已在回调确认里）。
      严格分档（叠加 volume_ratio20 < 0.7 / 0.6）与窗口变体（5/3、2/5）为
      实验档，经 BacktestParams 传入，不落本账本默认。
    events:
      - volume_up_surge
      - breakout_volume
      - pullback_shrink
      - bearish_expansion

  # ---------------- 缺口（规格 §4.8，V2.1 标定，pending_v2）----------------
  gap_events:
    rule_id: "gap_events"
    version: "2.0.0"
    provenance: "research_proxy"
    params:
      gap_min_atr: 0.25     # 缺口幅度 >= 0.25 x ATR(20) 才记录（〔标定 V2.1〕）
      atr_period: 20        # 规格引用 ATR(20)，非全局 ATR14
    formula: |
      gap_up(t)   = Low(t) > High(t-1) 且 Low(t) - High(t-1) >= gap_min_atr * ATR20(t)；
      gap_down(t) = High(t) < Low(t-1) 且 Low(t-1) - High(t) >= gap_min_atr * ATR20(t)；
      回补判定：缺口出现后价格回到缺口区间即「已回补」（向上缺口区间
      [High(t-1), Low(t)]，后续 Low(s) <= 区间上沿即回补；向下缺口对称），
      回补日 = 首次回到区间那根 K 线；未回补缺口才有目标位意义。
      目标 B 接入（规格 §10 优先级第 2 档）：信号日上方最近的未回补向上缺口，
      缺口上沿 Low(t) 作目标候选；经引擎 gap_target 开关启用（默认关，
      不改变既有结论的可复现性）。
      仅用当日与此前已完成日 K，严格前向；缺口属标志性动作（路牌层），
      只预警不必然反向。
    note_cn: |
      缺口是手册 2.5「异常大量、缺口、假突破属于标志性动作」的量化。gap_min_atr=0.25
      为〔标定 V2.1，待彪哥确认〕（敏感性 0.1/0.25/0.5 ATR，窗口用 ATR(20)）。
      v2.0.0 落地（2026-08-25 第四轮）：回补语义与目标 B 缺口档实装
      （rules/gap_events.py），另供缺口动能过滤实验（近 N 日未回补向上缺口，
      引擎 gap_momentum 开关）。不灌 live 事件日志（与 strict_structure 同纪律），
      供回测与 API 按需读取。规格 §10 目标优先级中的「均线密集区」档仍未实装
      （reward_risk_filter 待办）。
    events:
      - gap_up
      - gap_down
      - gap_filled
  # ---------------- 筹码分布代理 ----------------
  volume_profile_proxy:
    rule_id: "volume_profile_proxy"
    version: "1.1.0"
    provenance: "research_proxy"
    params:
      window: 120
      bins: 50
      value_area: 0.70
      support_zone_pct: 0.05
      poc_support_atr: 1.0    # 〔标定第四轮〕踩峰买：POC 在入场参考价下方 <= 1 x ATR20 内
      vacuum_overhead_max: 0.30  # 〔标定第四轮〕上方无套牢：overhead_supply_ratio <= 0.30
    formula: |
      把最近 120 根 K 线成交量均匀分配到 low..high 覆盖的价格箱
      POC = 代理量最大的价格箱
      VAL/VAH = 覆盖 70% 代理量的价值区下/上沿
      overhead_supply_ratio = 当前价以上箱体代理量占比
      support_density = 当前价下方 5% 区间代理量占比
      入场确认过滤器（v1.1.0 第四轮，引擎 profile_filter 开关、默认关）：
      poc_support = POC <= 入场参考价 且 (入场参考价 - POC) <= poc_support_atr * ATR20
      vacuum     = overhead_supply_ratio <= vacuum_overhead_max
      both = 两者同时；profile 按 (symbol, ISO周) 缓存，代理数据不可计算时确认不成立。
    note_cn: "OHLCV 无法知道真实持仓成本。界面必须写「筹码分布代理」，不得声称真实持仓成本。筹码只改善入场位置和盈亏比，不取代趋势判断（手册 4.5）。poc_support_atr / vacuum_overhead_max 为〔标定第四轮〕实验默认，开不开由实验说了算。"

  # ---------------- MACD 强度（研究代理，强度非转折）----------------
  macd_strength:
    rule_id: "macd_strength"
    version: "1.1.0"
    provenance: "research_proxy"
    params:
      fast: 12
      slow: 26
      signal: 9
    formula: |
      DIF = EMA(close, fast) - EMA(close, slow)
      DEA = EMA(DIF, signal)
      hist = 2 * (DIF - DEA)
      解读口径（只作强度/乖离，不作转折）：
        交叉（定时）：DIF 与 DEA 上下穿（金叉/死叉）-- MACD 能表达；
          hist 符号即 DIF×DEA 交叉状态（加速度量，只用于交叉判读，不作扩散判定）；
          DIF 穿越 0 轴 = EMA12 穿越 EMA26（上穿0轴/下穿0轴，两线排列翻转）
        多头排列乖离（状态）：DIF 相对 0 轴方向（排列）+ |DIF| 同号趋势
          （两线间距拉大=扩散、缩小=密集）-- MACD 能表达
        破线（close 破均线）-- MACD 不能表达，由 LEI 颜色（close vs EMA20 vs close_lag20）补齐
        均线拐头 -- MACD 不能表达，由均线斜率（ema20_slope / sma slopes）补齐
      不产生交易事件：金叉/死叉只是强度描述，不构成买点。
    note_cn: |
      MACD 研究均线的扩散和密集状态，本质是乖离率，表示强度而非转折趋势节点。
      测量分工：交叉（定时）看 DIF×DEA（hist 符号）；强度（状态）看 |DIF| 两线间距趋势--
      DIF 即 EMA12-EMA26 间距（一阶乖离本身），hist 是二阶动能，两者过半数 bar 趋势
      不一致，不能混用。状态描述词配一阶量。
      趋势转折 5 步骤中，MACD 只能表达「交叉」与「多头排列+乖离率」；
      「破线」与「均线拐头」需由系统既有的 LEI 颜色与均线斜率补齐，
      方可用 MACD 观察趋势强度。界面必须标注「研究代理」，并明示盲区补齐来源。

  # ---------------- 趋势后的首次均线回撤 ----------------
  first_ma_pullback:
    rule_id: "first_ma_pullback"
    version: "3.0.0"   # 3.0.0：V2 模块 A 重写落地（§15 第一轮，rules/first_ma_pullback.py）
    provenance: "research_proxy"
    params:
      ma_periods: [20, 60, 120]
      ma_touch_distance_atr: 1.0   # V2.1 §17〔标定〕：Low <= SMA_N + 1 x ATR(20)
      ma_touch_atr_period: 20      # V2 规格引用 ATR(20)，非全局 ATR14（决策点 4 折中）
      weekly_environment: "bull_alignment"   # §6 简化版：已完成周 20/60/120 双组多头排列
      entry_variants: ["early", "confirmed"] # A4 两版分别出事件
    formula: |
      (V2 已实现语义，3.0.0 起 live 与回测同源运行；v1 双阈值口径已于本轮替换)
      A1 门禁 = 时钟二类（clock_classifier，s60 年化 10%-100% 且非加速分支）
                + 日线完整多头排列（SMA20>SMA60>SMA120 且 EMA20>EMA60>EMA120，规格 §4.5）
                + 周线多头环境（已完成周 WSMA/WEMA 20/60/120 双组多头排列，规格 §6 简化版；
                  周线在该周最后交易日收盘后可用，规格 §3.2）；「近乎平行」仅后验记录
                  （evidence.parallelism_sma{60,120}_slope5），不作门禁（规格 §9 A1）；
      趋势生命周期 = A1 门禁 false->true 开启；SMA 排列破坏、收盘跌破 SMA120、或 LEI 转黑
                时重置（open 周期出 failed）；时钟离开二类或周线转空不重置、只阻断新触碰/入场；
      武装 = 收盘站上该 SMA（close > SMA_N，回撤以离开为前提）；
      A2 触碰 = 武装后 Low <= SMA_N + ma_touch_distance_atr x ATR(20) 且 close > close_lag_N
                （该 SMA 仍处上行压力方向，规格 §4.2 抵扣价判据）且当日时钟二类；
      is_first = 本生命周期内该均线第一次触碰（手册 4.4「第一次回撤要特别重视」）；
                其后触碰出事件但标 is_first=false，供分别统计（规格 §9 A2【原系统原则】）；
      A3 结构条件（触碰后至入场前，至少一种）= 本轮回撤内确认且未失效的严格底部构造
                （strict_structure），或存在 close 由 <=EMA20 上穿 >EMA20 的交易日；
      A4 入场触发（两版分别出 confirmed 事件，evidence.entry_variant 区分）：
                早期版 = close > EMA20 且 EMA20 上行（规格 §4.3）且 A3 成立且时钟二类+周线环境；
                确认版 = 早期版条件且 close > close_lag20（SMA20 上行，抵扣价判据）；
      A5 结构失效 = 入场前收盘跌破本轮回撤此前全部 low（结构低点被破坏）-> failed；
                入场事件携带 stop_price = 回撤自触碰日起最低 low（失效价 C）；
      回撤区离开 = 未触发任何入场而收盘回到触碰带上方 -> failed（价格离开回撤区），
                需重新武装才可再次触碰；
      两版入场均出后或失败后，本回撤周期结束；每个生命周期每条均线可有多轮触碰周期
                （首轮 is_first=true）。
    note_cn: |
      “第一次回撤 MA20/60/120”是用户交易笔记的研究代理量化，不冒充 LEI 原始规则；
      界面必须标注“研究代理”。
      3.0.0 = 规格 §9 模块 A 的 V2 重写（§15 第一轮落地）：A1 时钟二类门禁
      （clock_classifier 2.0.0）+ 双组多头排列 + 周线环境（features/weekly_context.py，
      规格已定（拍板）context_timeframe=周线）；A2 触碰改为 Low <= SMA_N + 1 x ATR(20)
      （〔标定 V2.1，待彪哥确认〕，敏感性 0.5/1/1.5 ATR；ATR 用 simple_average，
      决策点 4 折中口径）；A3 = 严格底部构造（strict_structure 2.0.0）或 EMA20 收复；
      A4 早期版/确认版分别出事件；A5 结构低点失效；首次 vs 非首次分别出事件供分组
      统计（第二轮对比）。回测执行（下一根开盘入场、A6 三版退出、盈亏比>=3 过滤、
      费用三档）在 backtest/engine.py，与 live pipeline 调同一份检测器。
      2.0.0 -> 3.0.0 事件 ID 随 rule_version 变化，历史事件已固化不受影响。
    events:
      - first_ma_pullback_touched
      - first_ma_pullback_confirmed
      - first_ma_pullback_failed

  # ---------------- P2.1 假突破快速收回 ----------------
  false_breakout_reclaim:
    rule_id: "false_breakout_reclaim"
    version: "1.0.0"
    provenance: "research_proxy"
    params:
      reference_lookback: 20        # 参考位 = 此前 reference_lookback 根已完成日 K 的最高 high
      breakout_pct: 0.01            # 收盘超过参考位该比例才算有效突破
      fail_breakdown_pct: 0.01      # 收盘跌破参考位该比例才算真跌破（假突破失败）
      reclaim_window: 3             # 被打回后，最多等待该根已完成日 K 内重新收回
      require_green: true           # 收回时 LEI 颜色需为 green
    formula: |
      reference(t) = max(high) over [t-reference_lookback, t-1]，仅用已完成日 K，无未来泄漏；
      breakout(t) = Close(t) >= reference(t)*(1+breakout_pct) 且前一日 Close < reference*(1+breakout_pct)；
      进入 breakout 观察后：
        shaken(t) = Low(t) <= reference(t)（盘中已被打回参考位下方）；
        confirmed(t) = shaken 之后、reclaim_window-1 根内 Close(t) >= reference(t)，
                      且完整多头排列保持、LEI 为 green；
        failed(t) = Close(t) < reference(t)*(1-fail_breakdown_pct)（真跌破），
                   或 reclaim_window 窗口耗尽仍未收回；
      每次有效突破独立计数；confirm/fail 后本轮消耗，下一次突破需收盘先回落参考位下方再重新站上。
    note_cn: |
      “假突破快速收回”是用户交易笔记的研究代理量化：突破前高/结构颈线后被打回，但很快重新
      收回且不破坏趋势，视为洗盘后延续。不是旧 Streamlit 泛化文案，也不冒充 LEI 原始规则。
      所有判断只使用当日及此前已完成日 K；界面必须标注“研究代理”，并显示参考位、突破日、
      被打回与收回条件、客观失效。
    events:
      - false_breakout_reclaim_watch
      - false_breakout_reclaim_confirmed
      - false_breakout_reclaim_failed

  # ---------------- P2.3 完整均线排列 + EMA 斜率加速度 ----------------
  ma_full_alignment:
    rule_id: "ma_full_alignment"
    version: "1.0.0"
    provenance: "research_proxy"
    params:
      periods: [20, 60, 120]
      slope_lookback: 1            # 斜率 = 当前均线 - slope_lookback 日前均线
      accel_lookback: 1            # 加速度 = 当前斜率 - accel_lookback 日前斜率
      ema_slope_period: 20         # 用于斜率/加速度的 EMA 周期
    formula: |
      bullish_alignment = SMA20 > SMA60 > SMA120 且三条 SMA 斜率均 > 0；
      bearish_alignment = SMA20 < SMA60 < SMA120 且三条 SMA 斜率均 < 0；
      alignment_start = 非排列 -> 排列 的切换日，按方向产生 bullish/bearish 事件；
      alignment_broken = 排列 -> 非排列 的切换日；
      ema20_slope_pct(t) = (EMA20(t) - EMA20(t-slope_lookback)) / EMA20(t-slope_lookback)；
      ema20_accel_pct(t) = ema20_slope_pct(t) - ema20_slope_pct(t-accel_lookback)；
      斜率/加速度为研究代理指标，仅作确认维度，不单独产生买卖指令。
    note_cn: |
      “完整均线排列 + 斜率加速度”是用户交易笔记的研究代理量化：把 20/60/120 完整多头/空头
      排列作为场景卡底层确认维度，并用 EMA20 斜率与加速度标准化描述动能变化。不是旧 Streamlit
      泛化文案，也不冒充 LEI 原始规则。界面必须标注“研究代理”，并展示排列方向、破坏条件与
      斜率/加速度当前值及客观失效。
    events:
      - ma_alignment_bullish_start
      - ma_alignment_bearish_start
      - ma_alignment_broken

  # ---------------- P2.2 日线信号后的次级别确认（日线代理）----------------
  low_level_confirmation:
    rule_id: "low_level_confirmation"
    version: "1.0.0"
    provenance: "research_proxy"
    params:
      confirmation_window: 2       # 日线信号触发后，最多等待该根已完成日 K 内出现次级别确认特征
      reclaim_tolerance_pct: 0.005 # 盘中刺穿参考位但收盘收回的容差
    formula: |
      触发：当日存在日线做多信号（首次回撤确认 / 双均线共同确认 / 结构绑定 EMA 转强到达
            结构确认或以上档位）；
      次级别确认特征（日线 OHLC 代理，因系统当前未接入 60 分钟数据）：
        intraday_reclaim = Low(t) <= reference_level*(1+reclaim_tolerance_pct)
                            且 Close(t) >= reference_level，即盘中刺穿参考位但收盘收回；
        reversal_candle  = 当日出现 bullish_engulfing 或 bullish_outside_reversal；
      确认：触发后 confirmation_window-1 根内出现 intraday_reclaim 或 reversal_candle，
            且收盘仍站在触发参考位上方；
      未出现则为“观察”，等待；触发信号失效或收盘跌破参考位则本轮消耗。
    note_cn: |
      “次级别确认”是用户交易笔记的研究代理量化：日线信号触发后用更低级别确认增强可信度。
      当前系统仅接入日线，真 60 分钟数据尚未连接，因此用日线 OHLC 的“盘中刺穿后收回”与
      反转 K 线作为次级别确认的日线代理，并在界面明确标注“日线代理 / 未接 60 分钟”。
      不是旧 Streamlit 泛化文案，也不冒充 LEI 原始规则。
    events:
      - low_level_confirmation_watch
      - low_level_confirmation_confirmed

  # ---------------- 模块 B：均线密集区突破（规格 §9 模块 B，研究代理）----------------
  dense_breakout:
    rule_id: "dense_breakout"
    version: "2.0.0"   # 2.0.0：V2 重写落地（§15 第三轮，rules/dense_breakout.py）
    provenance: "research_proxy"
    params:
      zone_exit_bars: 20   # 横盘（时钟三类）寿命的间歇容差：离开<=20根回来寿命延续
      dissolve_bars: 20    # 突破后带宽持续不成立的消散根数（生命周期静默结束）
    formula: |
      (V2 已实现语义，2.0.0 起 live 与回测同源；v1 纠缠度口径已替换)
      B1 环境 = 时钟三类（|s60| < 10%，clock_classifier）+ 密集两条件：
                整理时间 = 时钟三类状态寿命 >= minimum_consolidation_bars（126 根，
                允许 zone_exit_bars=20 根间歇）+ 当下六线带宽 max/min - 1 < 2%
                （即时条件；「整理时间」由横盘状态承担，非带宽天天达标）；
      B2 埋伏版（variant=ambush）= 密集区内双组多头排列（SMA20>SMA60>SMA120 且
                EMA20>EMA60>EMA120）false->true 切换日入场，等突破；
                止损 = 密集区最低 low（zone_low_water）；
      B2 突破版（variant=breakout）= 收盘突破密集区上沿（截至昨日的区间最高 high，
                防当根自我抬升），不要求排列（规格 §9 B2：排列是加仓条件非首进条件）；
                止损 = 密集区下沿（跌穿整个密集区 = 突破彻底失败；突破后回踩上沿
                是常见确认动作，不能作价格止损——B3 是双条件语义非价格线）；
      B3 失效（两动作不分先后、必须全部满足）= 收盘跌回密集区上沿下方 且
                close < SMA20 且 close < close_lag20（20 组下弯，抵扣价判据）；
      埋伏单附加底线 = 双组多头排列破坏（SMA20 <= SMA60）即失效；
      每个密集区生命周期内埋伏/突破各只允许一次确认；带宽持续 dissolve_bars
                根不成立则生命周期静默结束。
    note_cn: |
      “均线密集区突破”是规格 §9 模块 B 的研究代理量化，界面必须标注“研究代理”。
      2.0.0 = V2 重写（§15 第三轮落地）：B1 时钟三类门禁替换 v1 纠缠度口径；
      B2 埋伏/突破两版分别出事件（evidence.variant）；B3 两动作同日齐备才失效。
      实测（回测深池 10 年）：全池 19 个密集区生命周期、8 次埋伏、15 次突破——
      真密集区数年一遇（“横有多长竖有多高”的代价），样本稀少是特征不是缺陷。
      与 tradability_gate 的横盘参数共用单一来源（cluster_threshold/
      minimum_consolidation_bars）。
    events:
      - dense_breakout_watch
      - dense_breakout_confirmed
      - dense_breakout_failed

  # ---------------- 模块 C：2B / 破底翻反转（规格 §9 模块 C，研究代理）----------------
  two_b_reversal:
    rule_id: "two_b_reversal"
    version: "3.0.0"   # 3.0.0：V2 C1 结构重写落地（§15 第三轮，rules/two_b_reversal.py）
    provenance: "research_proxy"
    params:
      two_b_reclaim_bars: 5          # V2.1 §17〔标定〕：3 -> 5（待彪哥确认；敏感性 3/5/8），已生效
    formula: |
      (V2 C1 已实现语义，3.0.0 起 live 与回测同源；v1 摆动低点对口径已替换)
      C1 结构：L1 = 前低（最后一个已确认 swing low，左3右3 确认日可用）；
                价格收盘跌破 L1 创出新低 L2（假跌破，L2 = 破位期间最低 low，
                随新低下移，无需摆动确认）；two_b_reclaim_bars（默认 5）根内
                收盘收回 L1 上方 = 破底翻 / 多头 2B；
      C2 入场（三版本分别出事件）：v1 = 收回当日；v2 = 收回后 EMA20 拐头向上
                （复用 ema20_reclaim_state）；v3 = 收回后 EMA20 与 SMA20 共同向上
                （复用 dual_ma_bull_state）；止损 = L2（假跌破新低）；
      C3 失效：收盘跌破截至昨日的 L2（收盘创破位新低 = 真破位）-> 彻底失效；
                收复窗口耗尽亦失败；每个 L1 只允许一次 2B 循环（consumed）；
      大幅负乖离（bias_ema120）仅作 evidence 增强记录，不单独触发（规格 §4.7）。
    note_cn: |
      “2B/破底翻”是规格 §9 模块 C 的研究代理量化，界面必须标注“研究代理”。
      3.0.0 = V2 C1 结构重写（§15 第三轮）：L1 = 前低、跌破创新低 L2 无需摆动
      确认——“挖坑”不需要走出可确认的摆动结构，这正是 2B 与 M 底的区别
      （规格 §9 C1【原系统原则】：2B 不需要完整回撤波段）。与 v1 口径
      （L2/L1 双摆动低点对）根本不同，事件 ID 随 version 变化、历史不互相覆盖。
      实测（回测深池）：510300.SS 十年 v1/v2/v3 确认 99/64/57 次、失败 145 次。
    events:
      - two_b_reversal_v1_confirmed
      - two_b_reversal_v2_confirmed
      - two_b_reversal_v3_confirmed
      - two_b_reversal_failed

  # ---------------- 模块 D：假突破反向交易（规格 §9 模块 D / 手册 3.5，pending_v2）----------------
  module_d_false_breakout:
    rule_id: "module_d_false_breakout"
    version: "2.0.0"   # 2.0.0：落地（§15 第三轮，rules/module_d_false_breakout.py）
    provenance: "research_proxy"
    params:
      reclaim_window: 5          # 「快速反弹」窗口：V2 未给数值，暂对齐 C2 收复窗口（待彪哥定）
      reference: "dense_zone_recent_swing"  # 参照 = 密集成交区最近波谷/波峰
    formula: |
      (V2 已实现语义，2.0.0 起 live 与回测同源)
      D1 多头假跌破（两动作不分先后、必须全部满足）：
        (1) 收盘跌破密集区波谷（已确认摆动低点，available_date 在密集区生命周期内）
            后，reclaim_window（默认 5）根内收盘收回波谷上方；
        (2) 站上 20 均线组且 20 组向上弯曲：close > SMA20 且 close > close_lag20；
        两动作均成立且未失效 -> module_d_long_confirmed；止损 = 假跌破低点
        （破位期间最低 low，随新低下移）；
      D3 失效：收盘跌破假跌破低点（截至昨日）或收复窗口耗尽 -> failed；
      密集区生命周期复用 dense_breakout 的 B1 判定（时钟三类寿命 + 带宽），
      波谷参照复用 confirmed_pivots，不重复实现（单一真相源）；
      D2 空头假突破：本版仅做多，未实现（规格 direction 已定（拍板）仅做多）。
    note_cn: |
      D1 两动作定义是手册 3.5【原系统原则】（V2 §9 D1 填实）；「密集区波谷参照」
      与 reclaim_window=5 的快速反弹窗口为研究代理（V2 未给数值，暂对齐 C2 的 5）。
      2.0.0 落地（§15 第三轮）：密集区/波谷参照复用 dense_breakout 与
      confirmed_pivots。与 false_breakout_reclaim（P2.1 v1 近似件：向上突破前高
      被打回后收回）结构相似但方向相反、参照不同，回测分组对比、不合并。
      实测（回测深池）：全池 5 次确认、22 次失败。
    events:
      - module_d_long_confirmed
      - module_d_short_recorded
      - module_d_failed

  holding_watch_guard:
    rule_id: "holding_watch_guard"
    version: "1.1.0"
    provenance: "research_proxy"
    params:
      proximity_atr: 1.0   # 接近预警带宽（ATR 倍数）：|close-预设价| <= proximity_atr*atr 且未击穿时提醒
    formula: |
      持仓盯盘（plan_kind=holding_watch）退出提醒的承载规则（不产生入场信号）：
        TAKE_PROFIT_REACHED / STOP_PRICE_BREACHED / SIGNAL_WATCH_TRIGGERED；
        接近预警（未击穿，仅在 atr 可用时）：TAKE_PROFIT_APPROACHING / STOP_PRICE_APPROACHING。
      方向感知比较（只用当日可见收盘价或 14:45 盘中快照价）：
        long ：达到止盈 = close >= take_profit_price；击穿止损 = close <= stop_price；
        short：达到止盈 = close <= take_profit_price；击穿止损 = close >= stop_price；
        信号触发 = watch_signal_rule_ids 任一 rule_id 出现在当日 new_events。
      接近预警 = 未击穿/未达到 且 |close - 预设价| <= proximity_atr * atr（atr=None 跳过）：
        先到先报——已达到止盈或已击穿止损时不再发 APPROACHING，避免与击穿提醒重复。
      止损击穿为 block（纪律最硬：不得事后下移止损，语义同规格 §14）；
      止盈达到、接近预警与信号触发为 remind（提示到点/临近，退出与否仍由人决定）。
      三者 action_kind=EXIT，产 EXIT 待办，走既有催办/回执链路。
    note_cn: |
      “持仓盯盘”是人类 2026-08-05 明确的新增用法：标的已在场内，不需要再论证入场
      理由，只要价位或信号到了就提醒。触发条件（止盈价/止损价/信号 rule_id）由人
      自填，属 user_config 性质；本规则只承载“比较与提醒”这一层判定，标 research_proxy。
      仍然只记价位与状态，不记数量/金额/账户。止损击穿沿用规格 §14「不得在亏损后
      移动原定失效价」的纪律强度，故为 block；界面必须标注“研究代理”。
      接近预警（2026-08-06）：人类要求“在 ATR 范围内就去提醒”，而非等到精确击穿。
      proximity_atr 默认 1.0（1 倍 ATR），可在本账本调；atr 不可用时静默跳过，不阻断。

  # ---------------- B1 第一阻力 ----------------
  resistance_b1:
    rule_id: "resistance_b1"
    version: "1.1.0"
    provenance: "lei_explicit"
    params:
      lookback_years: 2   # 真实过去两年（≈ 730 自然日）
    formula: |
      B1 = 信号发生前已确认、过去两年内、时间上最近、价格高于当时收盘价的摆动高点
    note_cn: "B1 是第一阻力，不是强制止盈目标，也不是 3R 入场门槛。B1 不存在仍允许产生信号。"

  # ---------------- A6① 抵扣价退出（研究代理）----------------
  exit_ema20_costbasis:
    rule_id: "exit_ema20_costbasis"
    version: "1.0.0"
    provenance: "research_proxy"
    params:
      costbasis_period: 20      # 抵扣价周期，对应 close_lag20（规格 A6①）
      break_basis: "close"      # 已定（拍板，V2 §17）：以收盘确认
    formula: |
      condition(t) = Close(t) < EMA20(t) 且 Close(t) < close_lag{costbasis_period}(t)；
      exit_triggered(t) = condition 由 false -> true 的当日（上升沿触发，单次事件）；
      信号在 t 收盘后生成，最早 t+1 开盘执行（研究口径以 t 收盘后计入）；
      仅依赖当日及此前已完成日 K，追加未来行情不改变历史触发点。
    note_cn: |
      “抵扣价退出”是规格 A6① 的研究代理量化：持仓期间收盘同时跌破 EMA20 与 20 日抵扣价
      （=20 周期前收盘）即触发退出。该条件与 LEI 黑色定义同构，但作为独立退出规则单独
      成事件、可回测、可展示，不冒充 LEI 原始规则。界面必须标注“研究代理”。
      break_basis=close 已定（拍板，V2 规格 §17「以收盘为主」）。
    events:
      - exit_ema20_costbasis_triggered

  # ---------------- 盈亏比计算（规格第 10 节，研究代理，只算不强制）----------------
  reward_risk_filter:
    rule_id: "reward_risk_filter"
    version: "1.0.0"
    provenance: "research_proxy"
    params:
      range_lookback: 60          # 区间另一侧高点的回看根数（待确认）
      rr_min_ideal: 3             # 规格参考：盈亏比大于 3 比较理想
      rr_min_strong: 5            # 规格参考：作者案例倾向 5 以上
    formula: |
      A = 入场价（信号确认日收盘）；S = 失效价（入场依据的支撑/结构位被破坏处）；
      B = 目标价，优先级（只用信号时已存在、已确认的数据）：
        1) 已确认摆动高点（B1 第一阻力，available_date <= 信号日）；
        2) 筹码分布代理价值区上沿 VAH / 成交量峰 POC（高于入场价者）；
        3) 区间另一侧：近 range_lookback 根已完成的最高 high；
      R/R = (B - A) / (A - S)，要求 A > S 且 B > A；
      无法客观确定 B 时标记“目标不可计算”，不事后选最优目标；
      只计算展示，不做硬过滤（已确认）；回测分别看 R/R≥3 与 R/R≥5 两组。
    note_cn: |
      “盈亏比计算”是规格第 10 节的研究代理量化：入场前用信号时已存在的目标算 R/R。
      目标 B 优先级遵循 V2 规格 §10（摆动高点 > 未回补缺口 > 均线密集区 > 筹码密集区/
      成交量峰 > 区间另一侧；手册定义「第一个目标位 = 上方均线密集区」）；缺口档待
      gap_events（pending_v2，§15 第四轮）落地后接入，均线密集区档待 strict_structure/
      clock_classifier 落地后接入。
      无法客观确定 B 时标“目标不可计算”，绝不事后选最优目标。
      只算不强制（已确认；V2 §13 第 4 条与 §17 已定（原则）reward_risk_min=3，案例参考 5）。界面必须标注“研究代理”。range_lookback 待确认。
    events:
      - reward_risk_computed

  # ---------------- 费用与滑点（规格 §3.3 / §17，V2.1 标定，pending_v2）----------------
  fees_and_slippage:
    rule_id: "fees_and_slippage"
    version: "1.1.0"   # 1.1.0：backtest/engine.py::FeeModel 已接入（§15 第一轮）
    provenance: "research_proxy"
    params:
      stock_fee_bps: 5              # 美股股票单边 5bp（〔标定 V2.1〕；保守档 10bp）
      stock_per_share_usd: 0.005     # 与 5bp 取大者
      futures_fee_usd_per_lot: 2.5   # 期货：$2.5/手
      futures_slippage: "1 tick"     # 期货滑点：1 tick
      sensitivity_bps: [0, 5, 10]    # 敏感性：0 / 5 / 10bp
    formula: |
      美股股票：单边成本 = max(notional * stock_fee_bps/10000,
                               shares * stock_per_share_usd)；
      股指期货：单边成本 = 1 tick 滑点 + futures_fee_usd_per_lot 每手手续费；
      回测所有版本必须同时输出含费用与不含费用两组结果（规格 §16）。
    note_cn: |
      规格原文两处股指期货费用表述不一致（「1 tick + 0.005/股」与「1 tick + $2.5/手」），
      §17 参数表以「1 tick + $2.5/手」为准，待彪哥最终拍板（见 trading-spec-v2.md §3.3
      落盘注）。全部数值为〔标定 V2.1，待彪哥确认〕，敏感性 0/5/10bp。本条是回测
      成本假设而非行情信号规则；1.1.0 起由 backtest/engine.py::FeeModel 读取
      （往返费用 = 2 x max(bps 名义值, $0.005/股价)），报告同时输出含/不含费用两组。

  # ---------------- 可交易性门禁与趋势类型分类（规格第 13 节 + 第 2.2 节，研究代理）----------------
  tradability_gate:
    rule_id: "tradability_gate"
    version: "2.0.0"
    provenance: "research_proxy"
    implementation_status: "pending_v2"   # formula 仍为 v1 现行语义；V2 重写目标见 note_cn
    params:
      cluster_threshold: 0.02          # 六线纠缠度阈值（V2 §17 已定（原则）：2%）
      minimum_consolidation_bars: 126  # 横盘最短时间（V2 §17 已定（原则）：6 个月约 126 交易日；v1 为 120），已生效
      entanglement_lookback: 20        # 判断纠缠持续性的回看根数
      acceleration_slope_pct: 0.03     # EMA20 日斜率（占价比）超过此值视为加速（待确认）
      bias_extreme: 0.50               # 收盘相对 EMA120 乖离超过此值视为极端（待确认，规格参考 50%）
      atr_percentile_window: 120       # ATR 分位的回看窗口
      messy_color_flip_lookback: 20    # 多周期杂乱：颜色翻转计数窗口
      messy_color_flip_threshold: 4    # 窗口内翻转次数超过此值视为杂乱
      signature_action_lookback: 10    # 标志性动作（放量）回看根数
      signature_volume_ratio: 1.5      # 放量倍数阈值
    formula: |
      趋势类型分类（只依赖当日及此前已完成日 K）：
        entanglement = (max(六线) - min(六线)) / close，六线= SMA/EMA 20/60/120；
        ema20_slope_pct = ema20_slope / ema20；bias_ema120 = close/ema120 - 1；
        insufficient_data = position < minimum_consolidation_bars 或均线缺失；
        exhaustion（加速衰竭）= ema20_slope_pct >= acceleration_slope_pct 且 bias_ema120 >= bias_extreme；
        consolidating = entanglement <= cluster_threshold 且近 entanglement_lookback 日均纠缠 <= cluster_threshold*1.5；
        late_consolidation（横盘末期）= consolidating 且 ATR 分位 <= 0.25（波动压缩将破）；
        ranging（横盘反复）= consolidating 且非末期；
        trending（趋势）= 完整多头/空头排列 且 |ema20_slope_pct| 方向一致；
        unclear（趋势类型不明）= 既非上述任一明确类型。
      9 条无交易条件（规格第 13 节逐条）：
        1 趋势类型不明(unclear/insufficient) 2 模块不明(入场时判) 3 入场/目标/失效不能定义(入场时判)
        4 盈亏比<3(只算不强制，入场时标注) 5 横盘反复且无标志性动作 6 极端加速无持仓
        7 多周期杂乱(窗口内颜色翻转>=阈值) 8 数据不足(<120 或均线缺失) 9 依赖未来K线(系统前向，不触发)。
      可交易性 = 环境条件(1/5/6/7/8)均不阻断；入场时条件(2/3/4)结合信号判断、只算不强制。
    note_cn: |
      “可交易性门禁 + 趋势类型分类”是规格第 13 节（无交易条件）与第 2.2 节（道路/路牌）的研究代理
      量化：用均线纠缠度 + ATR 分位 + 斜率把行情分成横盘反复/横盘末期/趋势/加速衰竭，并逐条落地
      9 条无交易条件作为横切层。cluster_threshold/minimum_consolidation_bars/acceleration_slope_pct/
      bias_extreme 等均为待确认默认值（规格第 17 节），不得回测调参后冒充作者标准。界面必须标注
      “研究代理”。多周期(条件7)当前用日线颜色翻转代理，60min 未接入。
      V2 目标（规格 §4.4 / §13，pending_v2）：趋势类型分类切换为时钟五类 s60 口径
      （clock_classifier 供数），加速衰竭判据由 s60 > 100% 年化（或 s20 >= 2 x s60 且
      s60 > 40%）取代 EMA20 斜率 + 乖离组合；横盘判据 = 时钟三类叠加密集两条件
      （规格 §4.6）。cluster_threshold=2% 与 minimum_consolidation_bars=126 为 V2 §17
      已定（原则）值，126 已生效（代码直接读本参数，v1 为 120，横盘判定约延后
      6 根）；acceleration_slope_pct / bias_extreme 在时钟口径落地前继续作为 v1
      判据运行。
    events:
      - tradability_evaluated

  # ---------------- 时钟五类趋势分类（规格 §4.4 / 手册 2.4，V2.1 标定，pending_v2）----------------
  clock_classifier:
    rule_id: "clock_classifier"
    version: "2.0.0"   # 2.0.0：§15 第一轮落地（rules/clock_classifier.py）
    provenance: "research_proxy"
    params:
      slope_base: "sma60"        # 斜率载体：对数坐标斜率 = 涨跌幅 / 时间（手册 2.4）
      window: 60                 # s60 窗口（交易日）
      window_s20: 20             # s20 窗口（交易日）
      annualization: 252         # 年化交易日
      type3_max_abs_s60: 0.10    # 三类（横盘）：|s60| < 10% 年化（〔标定 V2.1〕）
      type2_min_s60: 0.10        # 二类（稳定上涨）下界；上界 = type1_min_s60
      type1_min_s60: 1.00        # 一类（加速）：s60 > 100% 年化（〔标定 V2.1〕）
      type1_s20_multiple: 2.0    # 一类或：s20 >= 2 x s60 且 s60 > 40%（〔标定 V2.1〕）
      type1_s60_floor: 0.40
    formula: |
      s60(t) = ln(SMA60(t) / SMA60(t-window)) / window * annualization；
      s20(t) = ln(SMA20(t) / SMA20(t-window_s20)) / window_s20 * annualization；
      五类分类（仅用截至当根收盘数据，无未来泄漏）：
        三类（横盘）  = |s60| < type3_max_abs_s60；
        二类（稳定上涨，主战场） = type2_min_s60 <= s60 <= type1_min_s60；
        一类（加速上涨）= s60 > type1_min_s60，或（s20 >= type1_s20_multiple*s60
                         且 s60 > type1_s60_floor）--后者捕捉「斜率正在陡峭化」；
        四类（稳定下跌）= 二类的负值镜像；五类（加速下跌）= 一类的负值镜像。
      多头可操作区间 = 时钟二类（2:30 - 12:30 语义）；三类只观察或埋伏（模块 B/D
      背景），一类无持仓不参与；角度（30 度约 2 点半、75 度约 12 点半）只是视觉语言，
      不做严格换算。
    note_cn: |
      时钟五类是手册 2.4 的 V2.1 标定量化（规格 §4.4【回测代理（V2.1 标定）】）：
      用 SMA60 的 60 交易日年化对数斜率分箱。全部分箱阈值与加速判据均为〔标定 V2.1，
      待彪哥确认〕：consolidation_slope 敏感性 5%/10%/20%，acceleration 边界 x0.5/x2。
      2.0.0 已落地（rules/clock_classifier.py）：一类优先于二类判箱（加速分支在 s60
      仍处二类区间时即判一类）；数据不足返回 0；与 tradability_gate 同纪律，不向主
      事件日志写每日事件，由模块 A 门禁（first_ma_pullback）、回测与界面按需读取。
      tradability_gate 趋势分类切换到 s60 口径仍排期 §15 第四轮（模块 A 门禁已先用）。
    events:
      - clock_type_evaluated

  # ---------------- 趋势五步状态机（规格 §5 / 手册 4.6、视频 18，pending_v2）----------------
  trend_stage:
    rule_id: "trend_stage"
    version: "2.0.0"
    provenance: "lei_inferred"
    params:
      cross_basis: "sma20_gt_sma60"   # 步骤 3 交叉口径（写死）：SMA20>SMA60；EMA20>SMA60 仅敏感性对照
      bias_source: "tradability_gate.bias_extreme"  # 步骤 5 乖离阈值来源（已定（原则）0.5）
      direction_side: "long_only"     # 系统仅做多（账本 direction 拍板），空头五步不实装
    formula: |
      以下降转上升五步（仅做多侧实装，上升转下降为镜像）：
        1 破线：close > EMA20；
        2 拐头：EMA20 上行（ema20_slope > 0，EMA 预警）且 SMA20 抵扣价判据
          close > close_lag20（SMA 确认，规格 §4.2）；两线方向不一致时不视为最强确认；
        3 交叉：SMA20 > SMA60（口径写死：确认线跨期交叉，与模块 A 的 SMA 体系
          一致；EMA20 > SMA60 仅作敏感性对照，不进默认公式）；
        4 排列：20/60/120 双组多头排列（EMA20>EMA60>EMA120 且 SMA20>SMA60>SMA120）；
        5 大幅乖离：bias_ema120 = close/EMA120 - 1 >= bias_extreme（0.5，已定（原则））。
      trend_stage(t) = 逐日满足 1..k 全部条件的最大 k（累进合取，可回退：
      破线失败即 0、拐头失败回落 1）；输出 0..5（0 = 未起步/数据不足）。
      大周期引力规则：背景周期（周线）均线方向与信号方向相反时，逆着大周期方向数
      步骤要打折扣，回测单独分组统计（规格 §5 / §6，metrics 大周期分组）。
    note_cn: |
      趋势五步来自手册 4.6 / 视频 18（原系统原则）。序列与「写成自定义指标」的建议
      为 lei_explicit；逐根 K 线的步骤判定细节（破线/拐头/交叉用哪条线、如何计数）为
      研究代理推断，故整条标 lei_inferred。v2.0.0 落地（2026-08-25 第四轮，
      rules/trend_stage.py）：步骤判据写死进 formula；实装为逐日状态字段供回测分组
      （入场时 stage 分组 + 大周期同向/逆向分组，规格 §16 输出要求）与 API 按需读取。
      与 state_machine（v1 底部生命周期状态机）/ interpreter 的底部生命周期 stage
      是两套维度，不合并。不灌 live 事件日志（与 strict_structure 同纪律）。
    events: []

  # ---------------- 模块 E：情绪极值择时（规格 V2.2 §9 模块 E / 手册 3.6、视频 13、14，pending_v2）----------------
  module_e_sentiment_extreme:
    rule_id: "module_e_sentiment_extreme"
    version: "1.0.0"
    provenance: "research_proxy"
    implementation_status: "pending_v2"   # V2.2 新增模块：独立轨道（规格 §15），指数层低频配置策略
    params:
      breadth_windows: [20, 50, 200]     # 已定（原则）
      breadth_extreme_low: 0.15          # 已定（原则）：20+50 日同时 <= 15%（v3 三线需 200 也 <=）
      breadth_extreme_high: 0.85         # 已定（原则）：对冲侧
      aaii_extreme: [-0.25, 0.25]        # 已定（原则）
      naaim_extreme: [0.40, 1.00]        # 已定（原则）
      putcall_bottom: 1.0                # 已定（原则）：> 1
      e_confirm_count: 1                 # 〔标定 V2.2〕v2 共振确认项最少数量
      e_reentry_cooldown_weeks: 4        # 〔标定 V2.2〕敏感性 2/4/8 周
      e_tranche_fraction: 0.50           # 〔标定 V2.2〕每信号投入剩余可用资金比例
      hedge_ratio: 0.50                  # 〔标定 V2.2〕敏感性 0/50/100%
      hedge_release: "leave_extreme"     # 〔标定 V2.2〕宽度离开极值区即平对冲
    formula: |
      （V2.2 §9 模块 E 目标契约，指数层独立轨道，未实现）
      E0 前提：美股长期牛市基础未变 = 本模块最大风险敞口，报告必须明示；
               指数层低频策略，不受规格 §13 个股门禁约束；
      E1 极值（全部作者原则值）：宽度主信号（20+50 日同时 <=15% 买入侧 / >=85% 对冲侧；
               200 日同入 = 三线共振，中长期级别信号），AAII ±25%、NAAIM 40/100%、
               Put/Call >1 为确认与过滤项（处理「没到极值也是人性之极」与
               「到了极值不立即反转」两种失效）；极值区可停留、可二次触及，
               必须冷却，不得重复触发；
      E2 买入三版本（分别测）：v1 宽度单信号（收盘确认、次日开盘买入）；
               v2 = v1 + 确认项 >= e_confirm_count 个；v3 = 20/50/200 三线全 <=15%；
               冷却 e_reentry_cooldown_weeks；每信号投入剩余可用资金 e_tranche_fraction；
      E3 持有：只买不卖——无止损、无目标位、不预设持有周期（设计而非遗漏，
               风险控制交给 E4 对冲与 E0 前提）；
      E4 高位对冲：顶部极值做空股指期货（ES/MES），名义 = hedge_ratio x 多头市值；
               宽度回落离开极值区即平对冲仓，不因指数下跌提前解除；
      E5 基准对照：与每周定投 DCA、买入持有同窗对比；
               跑不赢 DCA 即择时层没有增量。
    note_cn: |
      V2.2 新增（2026-08-24 版规格 §9 模块 E，溯源手册 3.6 / 视频 13、14）。
      指数层（SPY/QQQ，对冲腿 ES/MES）低频配置策略，与个股层 A-D 天然不冲突、
      资金与账目独立（规格 §12）；作者本人确认仍在实盘使用的唯一模块。
      数据依赖：标普 500 历史时点成分股名单与价格（防幸存者偏差——今日名单算
      历史宽度会系统性高估）、AAII/NAAIM 周度、CBOE put/call 日度、期货数据。
      数据实况（2026-08-25 核查）：sentiment_observations 0 行、A 股宽度快照空壳、
      SP500 宽度有实数据 9500+ 行、sp500_klines.parquet 1972 年起存在——
      v1 宽度单信号具备立即开跑条件，v2/v3 需先接入情绪数据。落地排期：
      规格 §15 独立轨道（与 A-D 主线并行），先跑 v1。
    events:
      - module_e_buy_signal
      - module_e_hedge_started
      - module_e_hedge_released

  # ---------------- 计划纪律守卫（规格 §14 + §13，研究代理，两层标注）----------------
  plan_discipline_guard:
    rule_id: "plan_discipline_guard"
    version: "1.0.0"
    provenance: "research_proxy"
    params:
      rr_min_ideal: 3             # 与 reward_risk_filter 对齐；只 hint 不拦（决策 3）
    formula: |
      监督员 plan-level alert 的承载规则（不产生交易信号）：
        INVALIDATION_BREACHED / PLAN_EXPIRING / PLAN_STALE_RULESET /
        PLAN_ORPHANED / MODULE_NOT_IMPLEMENTED / DATA_STALE / ENTRY_CONDITIONS_LOST。
      两层标注（决策 2）：原则引规格原文，判定逻辑标 research_proxy。
    note_cn: |
      规格第 14 节「任何时候不得在交易已经亏损后更换入场理由，从而移动原定失效价」
      是裸句（全文【原系统原则】/【回测代理】标记两者皆无），但它是整个监督员最硬的一条
      纪律。两层标注：原则出处标「规格 §14 原文」，可执行判定（方向分类器 + 硬规则）
      标 research_proxy + caveat，既不削弱权威又不违反红线 2。
      R/R 口径（决策 3）：规格 §13 第 4 条把「盈亏比小于 3」列为无交易条件，round1
      实现为「只算不强制」；人类 2026-08-04 明确定为只提示、永不拦截，文案「建议 >3，
      2–3 可接受」。此差异是人类决定非实现漂移，必须留出处。界面必须标注「研究代理」。

# ---------------- 状态机 ----------------
state_machine:
  version: "1.0.0"
  provenance: "lei_inferred"
  stages:
    - no_clue          # 无线索
    - bottom_watch     # 底部观察
    - structure_confirmed  # 结构确认
    - early_strength   # 早期转强
    - joint_confirmed  # 共同确认
    - trend_reinforced # 趋势增强
    - risk_watch       # 风险关注
    - key_risk         # 关键风险
    - invalidated      # 失效
  invariants:
    - "先前信号不因其他条件当天未满足而被丢弃。"
    - "共同确认读取当前状态，不要求当天重新穿越 EMA20。"
    - "长趋势改善时可从共同确认升级为趋势增强，不要求新的 EMA20 交叉。"
    - "触及 C 永久终止关联底部结构，后续上涨不能复活。"
    - "同一标的可同时保留多个底部来源；选最近有效结构为主结构，但不删除其他。"
    - "顶部与底部可暂时并存，界面显示冲突，不静默覆盖。"

# ---------------- 风险提示优先级（仅决定排序，不自动卖出）----------------
risk_priority:
  - c_touched_or_broken
  - top_plus_black
  - black
  - active_top_structure
  - turned_gray
  - volume_conflict
